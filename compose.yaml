name: llm-observability

services:
  ollama:
    build: docker/ollama
    environment:
      OLLAMA_MODEL: qwen3:4b
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_NUM_PARALLEL: "1"
    ports:
      - "127.0.0.1:11435:11434"
    volumes:
      - model_cache:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama show \"$$OLLAMA_MODEL\" >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      start_period: 15m
      retries: 3

  python:
    build: .
    init: true
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      ollama:
        condition: service_healthy

volumes:
  model_cache:
